<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F9FAFB"/>

  <!-- Ambient radar grid on the right -->
  <g opacity="0.09" transform="translate(860, 315)">
    <circle cx="0" cy="0" r="280" fill="none" stroke="#1E2A38" stroke-width="2"/>
    <circle cx="0" cy="0" r="210" fill="none" stroke="#1E2A38" stroke-width="2"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#1E2A38" stroke-width="2"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#1E2A38" stroke-width="2"/>
    <line x1="-290" y1="0" x2="290" y2="0" stroke="#1E2A38" stroke-width="1"/>
    <line x1="0" y1="-290" x2="0" y2="290" stroke="#1E2A38" stroke-width="1"/>
  </g>

  <!-- Prominent radar visual -->
  <g transform="translate(860, 315)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#1E2A38" stroke-width="2" opacity="0.2"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#1E2A38" stroke-width="2" opacity="0.22"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#1E2A38" stroke-width="2" opacity="0.25"/>

    <!-- Sweep -->
    <defs>
      <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
        <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4"/>
      </linearGradient>
    </defs>
    <path d="M 0 0 L 0 -180 A 180 180 0 0 1 180 0 Z" fill="url(#sweep)"/>
    <line x1="0" y1="0" x2="0" y2="-180" stroke="#3B82F6" stroke-width="2.5"/>

    <!-- Center + blips -->
    <circle cx="0" cy="0" r="4" fill="#1E2A38"/>
    <rect x="80" y="-118" width="18" height="18" rx="3" fill="#3B82F6" stroke="#1E2A38" stroke-width="2.5"/>
    <rect x="-100" y="60" width="14" height="14" rx="2" fill="none" stroke="#1E2A38" stroke-width="2" opacity="0.5"/>
    <rect x="100" y="110" width="14" height="14" rx="2" fill="none" stroke="#1E2A38" stroke-width="2" opacity="0.5"/>
    <rect x="-140" y="-30" width="12" height="12" rx="2" fill="#22C55E" opacity="0.8"/>
  </g>

  <!-- Left content: wordmark + tagline + CTA strip -->
  <g transform="translate(80, 120)">
    <!-- Small mark -->
    <g transform="translate(0, 0)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#1E2A38" stroke-width="3"/>
      <circle cx="28" cy="28" r="14" fill="none" stroke="#1E2A38" stroke-width="1.6" stroke-dasharray="3 4" opacity="0.4"/>
      <path d="M28 28 L46 14" stroke="#1E2A38" stroke-width="3" stroke-linecap="round"/>
      <rect x="41" y="9" width="10" height="10" rx="1.5" fill="#3B82F6" stroke="#1E2A38" stroke-width="1.6"/>
      <circle cx="28" cy="28" r="2.5" fill="#1E2A38"/>
    </g>
    <text x="70" y="40"
          font-family="Inter, sans-serif" font-size="36" font-weight="600"
          letter-spacing="-1" fill="#1E2A38">Pakket<tspan fill="#3B82F6">radar</tspan></text>
  </g>

  <g transform="translate(80, 220)">
    <text font-family="Inter, sans-serif" font-size="62" font-weight="600" letter-spacing="-2.2" fill="#111827">
      <tspan x="0" dy="0">Al je pakketten,</tspan>
      <tspan x="0" dy="76">op <tspan fill="#3B82F6">één radar</tspan>.</tspan>
    </text>
  </g>

  <g transform="translate(80, 430)">
    <text font-family="Inter, sans-serif" font-size="24" font-weight="400"
          fill="#6B7280" letter-spacing="-0.3">
      <tspan x="0" dy="0">PostNL, DHL, DPD en GLS in één overzicht.</tspan>
      <tspan x="0" dy="34">Bezorging aanpassen voor álle carriers.</tspan>
    </text>
  </g>

  <!-- Coming soon pill -->
  <g transform="translate(80, 530)">
    <rect x="0" y="0" width="300" height="44" rx="22" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
    <circle cx="22" cy="22" r="5" fill="#3B82F6"/>
    <text x="40" y="29" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#1D4ED8">
      Binnenkort beschikbaar · Black Friday 2026
    </text>
  </g>
</svg>
